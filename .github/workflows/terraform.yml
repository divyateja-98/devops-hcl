# .github/workflows/deploy-eks-argocd.yml
name: Deploy EKS and ArgoCD

on:
  push:
    branches: [devo]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # Optional: Link to a GitHub environment for better tracking and protection rules

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1 # Ensure this matches your Terraform 'var.region'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest' # Or a specific version like 'v1.28.0' to match EKS control plane version

      - name: Update kubeconfig
        # This command configures kubectl on the GitHub Actions runner to interact with your new EKS cluster
        run: aws eks update-kubeconfig --name my-cluster-new --region us-west-1
        # IMPORTANT: Ensure 'my-cluster-new' matches the 'name' in your aws_eks_cluster resource
        # in your main.tf file (e.g., var.cluster_name if you use a variable)

      - name: Install Helm
        uses: azure/setup-helm@v1 # Action to install Helm CLI

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq # <--- ADDED THIS STEP!

      - name: Install ArgoCD via Helm
        run: |
          mkdir -p ~/.helm # Ensures Helm 3 configuration directories exist
          mkdir -p ~/.config/helm # Ensures Helm 3 configuration directories exist
          echo "Adding ArgoCD Helm repository..."
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          echo "Installing/Upgrading ArgoCD..."
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd --create-namespace \
            --set server.service.type=LoadBalancer # Expose ArgoCD UI via AWS LoadBalancer

      - name: Wait for ArgoCD server to be ready
        # Give ArgoCD server time to spin up before trying to create applications
        run: |
          echo "Waiting for ArgoCD server pod to be available..."
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=argocd-server -n argocd --timeout=300s
          echo "ArgoCD server is ready."

      - name: Deploy ArgoCD Application for NGINX
        # This step creates the ArgoCD Application resource, telling ArgoCD to sync your NGINX manifests
        run: |
          echo "Applying ArgoCD Application manifest for NGINX..."
          kubectl apply -f manifests/argocd-apps/nginx-app.yaml
          echo "ArgoCD Application for NGINX deployed. ArgoCD will now begin syncing the NGINX app."

      - name: Get ArgoCD Initial Admin Password
        id: argocd_password_step
        run: |
          echo "Retrieving ArgoCD initial admin password..."
          # The password is base64 encoded in the secret
          ARGOCD_PASSWORD=$(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d)
          echo "argocd_password=$ARGOCD_PASSWORD" >> $GITHUB_OUTPUT
          echo "ArgoCD password retrieved."

      - name: Get ArgoCD Server LoadBalancer Hostname/IP # <--- Corrected indentation
        id: argocd_lb_step
        run: |
          echo "Waiting for ArgoCD LoadBalancer to provision an external IP/hostname..."
          MAX_ATTEMPTS=120
          SLEEP_TIME=5
          ARGOCD_LB_ENDPOINT=""
          for i in $(seq 1 $MAX_ATTEMPTS); do
            LB_STATUS=$(kubectl get svc argocd-server -n argocd -o json 2>/dev/null || true)
            if [ -n "$LB_STATUS" ]; then
              ARGOCD_LB_ENDPOINT=$(echo "$LB_STATUS" | jq -r '.status.loadBalancer.ingress[0].hostname' 2>/dev/null || echo "$LB_STATUS" | jq -r '.status.loadBalancer.ingress[0].ip' 2>/dev/null)
            fi
            if [ -n "$ARGOCD_LB_ENDPOINT" ] && [ "$ARGOCD_LB_ENDPOINT" != "null" ]; then
              echo "ArgoCD LoadBalancer endpoint found: $ARGOCD_LB_ENDPOINT"
              break
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: ArgoCD LoadBalancer endpoint not yet available, waiting ${SLEEP_TIME} seconds..."
            sleep $SLEEP_TIME
          done
          if [ -z "$ARGOCD_LB_ENDPOINT" ] || [ "$ARGOCD_LB_ENDPOINT" = "null" ]; then
            echo "Error: ArgoCD LoadBalancer endpoint not found after $MAX_ATTEMPTS attempts (${MAX_ATTEMPTS * SLEEP_TIME} seconds)."
            echo "Diagnostic Info: Check 'kubectl get svc argocd-server -n argocd -o yaml' for details."
            kubectl get svc argocd-server -n argocd -o yaml || true
            exit 1
          fi
          echo "argocd_lb_endpoint=$ARGOCD_LB_ENDPOINT" >> $GITHUB_OUTPUT

      - name: Get NGINX Application LoadBalancer Hostname/IP # <--- Corrected indentation
        id: nginx_lb_step
        run: |
          echo "Waiting for NGINX LoadBalancer to provision an external IP/hostname..."
          MAX_ATTEMPTS=120 # Adjust if your LoadBalancer provisioning is very slow
          SLEEP_TIME=5
          NGINX_LB_ENDPOINT=""

          for i in $(seq 1 $MAX_ATTEMPTS); do
            LB_STATUS=$(kubectl get svc nginx-service -n default -o json 2>/dev/null || true)
            if [ -n "$LB_STATUS" ]; then
              NGINX_LB_ENDPOINT=$(echo "$LB_STATUS" | jq -r '.status.loadBalancer.ingress[0].hostname' 2>/dev/null || echo "$LB_STATUS" | jq -r '.status.loadBalancer.ingress[0].ip' 2>/dev/null)
            fi

            if [ -n "$NGINX_LB_ENDPOINT" ] && [ "$NGINX_LB_ENDPOINT" != "null" ]; then
              echo "NGINX LoadBalancer endpoint found: $NGINX_LB_ENDPOINT"
              break
            fi

            echo "Attempt $i/$MAX_ATTEMPTS: NGINX LoadBalancer endpoint not yet available. Waiting ${SLEEP_TIME} seconds..."
            sleep $SLEEP_TIME
          done

          if [ -z "$NGINX_LB_ENDPOINT" ] || [ "$NGINX_LB_ENDPOINT" = "null" ]; then
            echo "Error: NGINX LoadBalancer endpoint not found after $MAX_ATTEMPTS attempts (${MAX_ATTEMPTS * SLEEP_TIME} seconds)."
            echo "Diagnostic Info: Check 'kubectl get svc nginx-service -n default -o yaml' for details."
            kubectl get svc nginx-service -n default -o yaml || true
            exit 1 # Fail the step
          fi

          echo "nginx_lb_endpoint=$NGINX_LB_ENDPOINT" >> $GITHUB_OUTPUT

      - name: Output Access Information
        run: |
          echo "=================================================================="
          echo "                     Deployment Complete!                         "
          echo "------------------------------------------------------------------"
          echo "   EKS Cluster Name: my-cluster-new"
          echo "   AWS Region: us-west-1"
          echo ""
          echo "   ArgoCD UI URL: https://${{ steps.argocd_lb_step.outputs.argocd_lb_endpoint }}"
          echo "   ArgoCD Username: admin"
          echo "   ArgoCD Initial Password: ${{ steps.argocd_password_step.outputs.argocd_password }}"
          echo "   (Consider changing this password after first login for security!)"
          echo ""
          echo "   NGINX Application URL: http://${{ steps.nginx_lb_step.outputs.nginx_lb_endpoint }}"
          echo "=================================================================="